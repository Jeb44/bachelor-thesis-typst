<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="sans-serif">

  <rect width="720" height="320" fill="white"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEFT: Disk / File System                                    -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="20" y="20" width="180" height="270" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="110" y="42" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">File System</text>

  <!-- Host executable -->
  <rect x="40" y="55" width="140" height="40" rx="5" fill="#dce9f7" stroke="#4a7eb5" stroke-width="1.5"/>
  <text x="110" y="71" text-anchor="middle" font-size="11" fill="#2c5282" font-weight="bold">host_app</text>
  <text x="110" y="86" text-anchor="middle" font-size="9" fill="#4a7eb5">(ELF / PE executable)</text>

  <!-- .so files -->
  <rect x="40" y="110" width="140" height="36" rx="5" fill="#fde8d4" stroke="#e07b39" stroke-width="1.5"/>
  <text x="110" y="125" text-anchor="middle" font-size="11" fill="#7b3a12" font-weight="bold">plugin_a.so</text>
  <text x="110" y="139" text-anchor="middle" font-size="9" fill="#e07b39">shared library</text>

  <rect x="40" y="158" width="140" height="36" rx="5" fill="#fde8d4" stroke="#e07b39" stroke-width="1.5"/>
  <text x="110" y="173" text-anchor="middle" font-size="11" fill="#7b3a12" font-weight="bold">plugin_b.so</text>
  <text x="110" y="187" text-anchor="middle" font-size="9" fill="#e07b39">shared library</text>

  <!-- Dynamic linker file -->
  <rect x="40" y="210" width="140" height="36" rx="5" fill="#e9e9e9" stroke="#888" stroke-width="1.5"/>
  <text x="110" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ld-linux.so</text>
  <text x="110" y="239" text-anchor="middle" font-size="9" fill="#666">dynamic linker</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MIDDLE: load arrows                                         -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#555"/>
    </marker>
    <marker id="arr-r-grn" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2ea86a"/>
    </marker>
  </defs>

  <!-- host → memory -->
  <line x1="181" y1="75" x2="279" y2="100" stroke="#4a7eb5" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
  <!-- plugin_a → memory -->
  <line x1="181" y1="128" x2="279" y2="168" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
  <!-- plugin_b → memory -->
  <line x1="181" y1="176" x2="279" y2="210" stroke="#e07b39" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
  <!-- linker → memory -->
  <line x1="181" y1="228" x2="279" y2="250" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>

  <!-- load label -->
  <text x="228" y="138" text-anchor="middle" font-size="9" fill="#888" font-style="italic">mmap / load</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- RIGHT: Process Virtual Memory                              -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="280" y="20" width="420" height="270" rx="10" fill="#fafffe" stroke="#2ea86a" stroke-width="2"/>
  <text x="490" y="42" text-anchor="middle" font-size="12" fill="#1a7a4a" font-weight="bold">Process Virtual Address Space</text>

  <!-- Host code segment -->
  <rect x="300" y="55" width="180" height="40" rx="5" fill="#dce9f7" stroke="#4a7eb5" stroke-width="1.5"/>
  <text x="390" y="71" text-anchor="middle" font-size="11" fill="#2c5282" font-weight="bold">Host Code Segment</text>
  <text x="390" y="85" text-anchor="middle" font-size="9" fill="#4a7eb5">.text  .rodata</text>

  <!-- Host data/heap/stack -->
  <rect x="300" y="103" width="180" height="52" rx="5" fill="#dce9f7" stroke="#4a7eb5" stroke-width="1.5"/>
  <text x="390" y="119" text-anchor="middle" font-size="11" fill="#2c5282" font-weight="bold">Host Data / Stack / Heap</text>
  <text x="390" y="133" text-anchor="middle" font-size="9" fill="#4a7eb5">.data  .bss</text>
  <text x="390" y="148" text-anchor="middle" font-size="9" fill="#4a7eb5">runtime allocations</text>

  <!-- plugin_a segment -->
  <rect x="300" y="163" width="180" height="40" rx="5" fill="#fde8d4" stroke="#e07b39" stroke-width="1.5"/>
  <text x="390" y="179" text-anchor="middle" font-size="11" fill="#7b3a12" font-weight="bold">plugin_a.so Segment</text>
  <text x="390" y="193" text-anchor="middle" font-size="9" fill="#e07b39">.text  .data  .rodata</text>

  <!-- plugin_b segment -->
  <rect x="300" y="211" width="180" height="40" rx="5" fill="#fde8d4" stroke="#e07b39" stroke-width="1.5"/>
  <text x="390" y="227" text-anchor="middle" font-size="11" fill="#7b3a12" font-weight="bold">plugin_b.so Segment</text>
  <text x="390" y="241" text-anchor="middle" font-size="9" fill="#e07b39">.text  .data  .rodata</text>

  <!-- dynamic linker segment -->
  <rect x="300" y="259" width="180" height="22" rx="5" fill="#e9e9e9" stroke="#888" stroke-width="1.5"/>
  <text x="390" y="274" text-anchor="middle" font-size="10" fill="#555">ld-linux.so (linker/loader)</text>

  <!-- dlsym / symbol resolution box -->
  <rect x="500" y="90" width="185" height="130" rx="8" fill="#f0faf5" stroke="#2ea86a" stroke-width="1.5"/>
  <text x="592" y="108" text-anchor="middle" font-size="11" fill="#1a7a4a" font-weight="bold">Symbol Resolution</text>
  <text x="592" y="124" text-anchor="middle" font-size="9" fill="#2ea86a">① dlopen("plugin_a.so")</text>
  <text x="592" y="140" text-anchor="middle" font-size="9" fill="#2ea86a">② dlsym(handle, "init")</text>
  <text x="592" y="156" text-anchor="middle" font-size="9" fill="#2ea86a">③ fn ptr → plugin code</text>

  <!-- divider -->
  <line x1="515" y1="163" x2="670" y2="163" stroke="#2ea86a" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="592" y="177" text-anchor="middle" font-size="9" fill="#2ea86a">same address space:</text>
  <text x="592" y="191" text-anchor="middle" font-size="9" fill="#2ea86a">no serialization needed</text>
  <text x="592" y="205" text-anchor="middle" font-size="9" fill="#2ea86a">direct fn-pointer calls</text>

  <!-- arrow from resolution box to plugin segment -->
  <line x1="500" y1="155" x2="482" y2="183" stroke="#2ea86a" stroke-width="1.5" marker-end="url(#arr-r-grn)"/>

</svg>
